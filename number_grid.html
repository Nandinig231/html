<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number_Grid</title>
        <style>
            .container{
                display: grid;
                border: 1px solid green;
                grid-row: 25%25%25%25%;
                grid-column:25%25%25%25%;
                gap: 1px;
            }
            .header{
                background-color: orangered;
                height: 25vh;
                grid-row: 1/2;
                grid-column: 1/5;
            }
            .sb1{
                background-color: rgb(0,183,255);
                height: 25vh;
                grid-row: 2/3;
                grid-column: 1/5;
            }
            .sb2{
                background-color: rgb(0,183,255);
                height: 25vh;
                grid-row: 2/3;
                grid-column: 2/3;
            }
            .sb3{
                background-color: rgb(0,183,255);
                height: 25vh;
                grid-row: 2/3;
                grid-column: 3/4;
            }
            .sb{
                background-color: rgb(56,230,128);
                height: 50vh;
                grid-row: 2/4;
                grid-column: 4/5;
            }
            .main{
                background-color: rgb(229,239,91);
                height: 25vh;
                grid-row: 3/4;
                grid-column: 1/4;
            }
            .footer{
                background-color: rgb(79, 14, 171);
                height: 25vh;
                grid-row: 4/5;
                grid-column: 1/5;
            }   
        </style>
</head>
<body>
    <div class="container">
        <div class="header"> Header Element
            <span>Home</span>
            <span>About</span>
            <span>Login</span>
        </div>
        <div class="sb1"> Small Box 1</div>
        <div class="sb2"> Small Box 2</div>
        <div class="sb3"> Small Box 3</div>
        <div class="sb"> Side Bar</div>
        <div class="main"> Main Content</div>
        <div class="footer"> Footer Part</div>
    </div>
</body>
</html>
